<!DOCTYPE html>
<html>
<head>
  <title>8章課題</title>
  <meta name="description" content="このページは8章の課題です。">
  <meta charset="UTF-8">
</head>
<body>
  <header>
    <h1>SAMURAIニュース</h1>
    <nav>
      <a href="https://www.sejuku.net/">ホーム</a>
      <a href="https://www.sejuku.net/">社会</a>
      <a href="https://www.sejuku.net/">経済</a>
      <a href="https://www.sejuku.net/">スポーツ</a>
      <a href="https://www.sejuku.net/">テクノロジー</a>
    </nav>
  </header>
  <main>
    <article>
      <h2>社会</h2>
      <section>
        <h3>和菓子店も「トリックオアトリート！」</h3>
        <p>日本でも年々人気の高まるハロウィン。<br>今年は大手和菓子店5社がハロウィン向けの和菓子セットを共同開発しました。</p>
        <audio controls src="ichi.mp3"></audio>
      </section>
      <section>
        <h3>私のおすすめ和菓子アンケートフォーム</h3>
        <form>
          <label for="name">氏名</label>
          <input type="text" id="name" name="name" placeholder="名前を入力してください">
          <br><br>
          
          <label for="age">年代</label>
          <select id="age" name="age">
            <option value="">選択してください</option>
            <option value="under10">10代以下</option>
            <option value="20s">20代</option>
            <option value="30s">30代</option>
            <option value="over40">40代以上</option>
          </select>
          <br><br>
          
          <label>性別</label><br>
          <input type="radio" id="male" name="gender" value="male">
          <label for="male">男性</label>
          <input type="radio" id="female" name="gender" value="female">
          <label for="female">女性</label>
          <input type="radio" id="other" name="gender" value="other">
          <label for="other">その他</label>
          <br><br>
          
          <label for="wagashi">おすすめ和菓子の名称</label>
          <input type="text" id="wagashi" name="wagashi" placeholder="例：みたらし団子">
          <br><br>
          
          <label for="reason">おすすめする理由</label><br>
          <textarea id="reason" name="reason" rows="5" cols="40"></textarea>
          <br><br>
          
          <label for="agree">
            個人情報保護方針に同意する
            <input type="checkbox" id="agree" name="agree" value="agree">
          </label>
          <br><br>
          
          <button type="submit">送信</button>
          <button type="reset">リセット</button>
        </form>
      </section>
    </article>
    <article>
      <h2>テクノロジー</h2>
      <section>
        <h3>SAMURAIが新しい動画をリリース</h3>
        <p>SAMURAI公式YouTubeで新しい動画がリリースされました。<br>動画の内容はHTML/CSSの解説です。</p>
      </section>
    </article>
  </main>
  <footer>
    <p>&copy;SAMURAIニュース</p>
  </footer>
</body>
</html>
